name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props
      - name: Restore
        run: dotnet restore WinARD.sln -p:Platform=x64
      - name: Format
        run: dotnet format WinARD.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build WinARD.sln -c Release -p:Platform=x64 --no-restore -warnaserror
      - name: Test
        run: dotnet test WinARD.sln -c Release -p:Platform=x64 --no-build --no-restore
      - name: Build packaging fixture artifacts
        shell: pwsh
        run: ./packaging/portable.ps1 -Version 0.1.0.0
      - name: Packaging script fixtures
        shell: pwsh
        run: |
          ./packaging/tests/portable-version.Tests.ps1
          ./packaging/tests/resolve-version.Tests.ps1
          ./packaging/tests/check-licenses.Tests.ps1
          ./packaging/tests/verify-artifacts.Tests.ps1 -ExpectedVersion 0.1.0.0
          ./packaging/tests/binary-version.Tests.ps1 -ExpectedVersion 0.1.0.0
          ./packaging/tests/workflows.Tests.ps1
      - name: License allowlist gate
        shell: pwsh
        run: ./packaging/check-licenses.ps1
      - name: NuGet vulnerability gate
        shell: pwsh
        run: ./packaging/check-vulnerabilities.ps1
